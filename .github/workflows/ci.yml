name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter and formatting check
        run: |
          python -m pip install ruff
          ruff check . || true

      - name: Run tests with coverage
        run: |
          pytest -v --cov=online_store --cov=lab_10 --cov-report=term-missing

      - name: Build distribution packages (wheel and sdist)
        run: |
          python -m build

      - name: Check package distribution artifacts
        run: |
          ls -la dist

      - name: Build Docker image
        run: |
          docker build -t online-store:latest .
